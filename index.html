<style>
/* 和紙の札：淡い藤色の地に、生成りの札。合った字は緑、できた言葉は朱色 */
:root{
  --bg:#e8e4f0; --paper:#fffdf7; --ink:#26323a; --ink2:#4f5d66; --line:#26323a22;
  --land:#f6f0e1; --edge:#8a8170; --sea:#cfe1ea; --route:#c2412a; --route2:#9b3220; --go:#2f8a5b; --goal:#d2492f; --nb:#ffe7a3; --gold:#d79b2c;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;

}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--route)}.dots i.done{background:var(--ink)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--route);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--route2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--route2)}
button.main.alt{background:#2f5d7a;box-shadow:0 4px 0 #1d3d52}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--route2);display:inline-flex;align-items:center;min-height:44px}
/* 字の札とます */
.ask{text-align:center;font-size:15px;font-weight:800;margin:0;color:var(--ink2)}
.kan{text-align:center;font-size:30px;font-weight:800;margin:0;min-height:40px;letter-spacing:.08em}
.kan small{display:block;font-size:12px;color:var(--ink2);letter-spacing:0;font-weight:500}
.slots,.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slots button,.tiles button{all:unset;box-sizing:border-box;cursor:pointer;width:var(--tw,52px);height:var(--tw,52px);min-height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:calc(var(--tw,52px) * .5)}
.slots button{background:#fffdf7aa;border:2px dashed #26323a40}
.slots button.f{background:var(--paper);border:2px solid var(--ink);box-shadow:0 3px 0 #26323a22}
.slots button.lock{background:#2f8a5b;border-color:#2f8a5b;color:#fff;cursor:default;box-shadow:0 3px 0 #1d5c3b}
.slots button.hint{background:#ffe7a3;border-color:var(--gold);color:var(--ink)}
.slots.win button{background:var(--route);border-color:var(--route);color:#fff;box-shadow:0 3px 0 var(--route2)}
.slots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiles{min-height:58px}
.tiles button{background:var(--paper);border:2px solid var(--line);box-shadow:0 3px 0 #26323a18}
.tiles button.used{visibility:hidden}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid #2f5d7a;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #26323a1c;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:22px;font-weight:800}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:#26323a26}
/* ホーム */
.title{font-weight:800;font-size:36px;letter-spacing:.06em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.stats.five div{padding:8px 2px;min-width:0}.stats.five small{display:block;overflow-wrap:anywhere}
.rank{text-align:center;font-size:13px;color:var(--route2)}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:24px;text-align:center;margin:0}
.res{display:flex;flex-direction:column;gap:6px}
.res div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 言葉帳 */
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.dex div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px;min-height:44px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
.dex div small{font-size:11px;color:var(--ink2)}
.dex .no{opacity:.45}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--route2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
.achs{display:flex;flex-direction:column;gap:8px}
.achs div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.achs div.got{border-color:var(--gold);background:#fffaf0}
.achs b{font-size:15px}.achs div.got b{color:#9a6b12}
.achs small{font-size:12px;color:var(--ink2)}
.achs i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--go) var(--p),var(--line) var(--p))}
.newach{border:1px solid var(--gold);background:#fffaf0;font-weight:800;border-radius:14px;padding:12px;text-align:center;font-size:15px;line-height:1.6}
[hidden]{display:none!important}
/* 色だけで分けない：合った字は ✓ と実線、空きは点線、できた言葉は二重線。進み具合は ✓ と高さ */
.slots button{position:relative}
.slots button.lock::after{content:"✓";position:absolute;top:-7px;right:-5px;width:17px;height:17px;box-sizing:border-box;border-radius:50%;background:var(--paper);color:#1d5c3b;border:2px solid currentColor;font-size:10px;line-height:1;display:grid;place-items:center;font-weight:800}
.slots.win button{border-style:double;border-width:4px}
.dots i{display:grid;place-items:center;font-size:0;color:#fff;font-style:normal}
.dots i.on,.dots i.done{height:10px;margin-top:-2px}.dots i.done{font-size:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 色の見分けを助ける（カラーユニバーサルデザインの組：合った字は青・できた言葉は朱） */
html.a11y-cvd .slots button.lock{background:#0072B2;border-color:#0072B2;box-shadow:0 3px 0 #004b75}
html.a11y-cvd .slots button.lock::after{color:#004b75}
html.a11y-cvd .slots.win button{background:#D55E00;border-color:#8a3d00;color:#fff}
html.a11y-cvd .slots button.f{border-width:3px}
html.a11y-cvd .achs i{background:linear-gradient(90deg,#0072B2 var(--p),var(--line) var(--p))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.a11y-btn.a11y-float{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:2147483000}

<script id="a11y-script">

<script>

  $("kan").innerHTML = cur.done || cur.kan ? `${esc(p.w[0])}${cur.done ? `<small>${p.w[1]}</small>` : "<small>漢字のヒント</small>"}` : "";
  $("slots").classList.toggle("win", cur.done);
  $("slots").innerHTML = cur.slots.map((t, j) => `<button data-j="${j}" class="${t === null ? "" : cur.lock[j] ? "lock" : "f"}" ${t === null || cur.lock[j] || cur.done ? "disabled" : ""} aria-label="${j + 1}字目${t === null ? "（空き）" : "：" + p.tiles[t] + (cur.done ? "（できた）" : cur.lock[j] ? "（場所が合った字・動かせない）" : "（押すと戻す）")}">${t === null ? "" : p.tiles[t]}</button>`).join("");
  $("tiles").innerHTML = p.tiles.map((ch, t) => `<button data-t="${t}" class="${used.has(t) ? "used" : ""}" ${used.has(t) || cur.done ? "disabled" : ""} aria-label="${ch}">${ch}</button>`).join("");
  $("slots").querySelectorAll("button[data-j]").forEach((b) => (b.onclick = () => takeBack(+b.dataset.j)));
  $("tiles").querySelectorAll("button[data-t]").forEach((b) => (b.onclick = () => put(+b.dataset.t)));
  $("left").textContent = cur.done ? "" : `まちがい ${cur.miss}${cur.hints ? `・ヒント ${cur.hints}` : ""}`;
  $("answer").disabled = cur.done || cur.slots.includes(null);
  $("answer").style.opacity = $("answer").disabled ? ".45" : "";
  $("clear").disabled = cur.done || cur.slots.every((t, j) => t === null || cur.lock[j]);
  if ($("hint")) $("hint").disabled = cur.done || cur.hints >= 2;
}
function put(t) {
  if (cur.done || cur.slots.includes(t)) return;
  const j = cur.slots.indexOf(null); if (j < 0) return;
  cur.slots[j] = t; buzz(); keep(); paint();
}
function takeBack(j) { if (cur.done || cur.lock[j] || cur.slots[j] === null) return; cur.slots[j] = null; keep(); paint(); }
function clear() { if (cur.done) return; cur.slots = cur.slots.map((t, j) => (cur.lock[j] ? t : null)); keep(); paint(); }
function submit() {
  if (cur.done || cur.slots.includes(null)) return;
  const word = cur.slots.map((t) => cur.p.tiles[t]).join("");
  if (word === cur.p.w[1]) return solve();
  // ちがう：場所が合っていた字は緑で残し、ほかは札に戻す
  cur.miss++; let hit = 0;
  cur.slots = cur.slots.map((t, j) => { if (cur.p.tiles[t] === cur.ans[j]) { cur.lock[j] = true; hit++; return t; } return null; });
  keep(); paint(); buzz(40);
  const el = $("slots"); el.classList.remove("bad"); if (!calm()) { void el.offsetWidth; el.classList.add("bad"); }
  toast(hit ? `場所が合った字 ${hit}/${cur.ans.length}` : "場所が合った字はありません");
}
// ヒント：1回目は左から1字を正しい場所に置く。2回目は漢字の書き方を見せる
function hint() {
  if (cur.done || cur.hard || cur.hints >= 2) return;
  if (cur.hints === 0) {
    const j = cur.lock.indexOf(false); if (j < 0) return;
    let t = cur.p.tiles.findIndex((ch, x) => ch === cur.ans[j] && !cur.slots.some((y, q) => y === x && cur.lock[q]));
    const from = cur.slots.indexOf(t); if (from >= 0) cur.slots[from] = null;
    cur.slots[j] = t; cur.lock[j] = true;
    toast(`${j + 1}字目は「${cur.ans[j]}」`);
  } else { cur.kan = true; toast("漢字で書くと…"); }
  cur.hints++; keep(); paint();
}
function solve() {
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  cur.done = true; buzz([10, 40, 10]);
  const p = cur.p, rec = { m: cur.miss, h: cur.hints };
  let saved = false;
  // 別のタブで同じ問題のまちがい・ヒントが多く保存されていたら、多いほうを記録する（古いタブで★を増やさない）
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; saved = true; if (r.cur && r.cur.i === cur.i) { rec.m = Math.max(rec.m, r.cur.miss || 0); rec.h = Math.max(rec.h, r.cur.hints || 0); } r.res.push(rec); r.cur = null; s.words++; s.seen[p.w[1]] = (s.seen[p.w[1]] || 0) + 1; });
  if (!saved) { toast("別の画面で先に進んでいます"); return play(); }
  cur.miss = rec.m; cur.hints = rec.h; paint();
  const st = starsOf(rec), r = s.runs[MODE], fin = r && r.res.length >= r.list.length;
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">✓ できた！ ${starStr(st)}</div>
    <p class="note">${rec.m ? `${rec.m}回まちがえて作りました。` : "一度もまちがえずに作りました。"}${rec.h ? `ヒント${rec.h}回。` : ""}</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  let first = false;
  const rec = recOf(run);
  let fresh = [];
  save((s2) => {
    first = bank(s2, run);
    // まだ知らせていない実績を、この結果の画面で知らせる（練習で取った分もここで）
    const got = s2.ach || {}; fresh = achDone(s2).filter((n) => !got[n]); fresh.forEach((n) => { got[n] = 1; }); s2.ach = got;
    // 別のタブで同じモードの新しい回が始まっていたら、それは消さない
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, fresh);
  result(run.mode, run.date, first, undefined, fresh);
}
// 共有の文：言葉（答え）は出さない。一発🟩・2回までまちがい🟨・それ以上🟧、ヒントを使ったら💡
const sq = (r) => (r.h ? "💡" : r.m === 0 ? "🟩" : r.m <= 2 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  const all = rec.r.every((r) => r.m === 0 && !r.h);
  return `ことばならべ${mode === "h" ? " 上級" : ""} #${dayNo(k)} ${md(k)}\n${rec.r.map(sq).join("")}${all ? " 全部一発" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, fresh) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" ? dailyList(k) : hardList(k);
  const rec = mode === "p" ? prec : (mode === "d" ? s.days : s.hdays)[k];
  if (!rec) return home();
  const all = rec.r.every((r) => r.m === 0 && !r.h), text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && all && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>ことばならべ<small>${mode === "d" ? `今日の3問 #${dayNo(k)}` : mode === "h" ? "上級" : "練習"}</small></h1><span></span></header>
    <p class="big">${all ? "全部、一発で作った！" : `${list.length}語 作った`}</p>
    ${fresh && fresh.length ? `<div class="newach">新しい実績：${fresh.map(esc).join("・")}</div>` : ""}
    <div class="res">${list.map((it, j) => { const p = probOf(it), r = rec.r[j]; return `<div><span>${esc(p.w[0])}（${p.w[1]}）<br><small style="color:var(--ink2)">まちがい${r.m}回${r.h ? `・ヒント${r.h}` : ""}</small></span>${starStr(starsOf(r))}</div>`; }).join("")}</div>
    ${mode !== "p" ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩一発　🟨2回までまちがい　🟧もっと　💡ヒント<br>次の3問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：7字と8字に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">言葉帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if (mode !== "p") {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

// 実績：取れたものと、まだのものの進み具合
function ach() {
  const L = achList(load());
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${L.filter((a) => a.done).length}/${L.length}</small></h1><span></span></header>
    <div class="achs">${L.map((a) => `<div class="${a.done ? "got" : ""}"><b>${a.done ? "★" : "☆"} ${esc(a.name)}</b><small>${esc(a.desc)}</small>${a.done ? "" : `<i style="--p:${Math.round((a.cur / a.goal) * 100)}%"></i><small>${a.cur}/${a.goal}</small>`}</div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}
// 言葉帳：作った言葉を字の数ごとに数え、新しい順に並べる
function dex() {
  const s = load(), got = new Set(Object.keys(s.seen)), rows = [];
  for (let lv = 0; lv < T.LV.length; lv++) { const P = T.W[T.LV[lv].key], mine = P.filter((w) => got.has(w[1])); rows.push({ L: T.LV[lv], all: P.length, mine }); }
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>言葉帳<small>${got.size}語・作った回数 ${s.words}</small></h1><span></span></header>
    <p class="note">作った言葉が集まります。字の数ごとの数です。</p>
    <div class="stats five">${rows.map((r) => `<div><b>${r.mine.length}</b><small>${r.L.len}字/${r.all}</small></div>`).join("")}</div>
    <div class="dex">${rows.flatMap((r) => r.mine).map((w) => `<div>${esc(w[0])}<small>${w[1]}</small></div>`).join("") || `<p class="note" style="grid-column:1/-1">まだありません</p>`}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

window.__kn = { achList, maxStreak, mode: () => MODE, T, dailyList, hardList, probOf, starsOf, todayKey, dayNo, shareText, streak, load, valid, cur: () => cur, put: (t) => put(t), submit: () => submit(), hint: () => hint(), play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
